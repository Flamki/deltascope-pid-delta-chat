[project]
name = "deltascope"
version = "2.0.0"
description = "Format-agnostic engineering document delta and grounded chat"
requires-python = ">=3.11"
dependencies = [
  "pymupdf==1.28.0",
  "rapidfuzz>=3.14,<4",
  "vercel>=0.5,<1",
]

[project.optional-dependencies]
dwg = [
  "ezdxf>=1.4,<2"
]
ocr = [
  "rapidocr-onnxruntime==1.4.4",
  "opencv-python==5.0.0.93",
  "Pillow>=10.0"
]

[tool.uv]
package = false

[tool.uv.sources]
opencv-python = { path = "vendor/opencv-python-shim" }
