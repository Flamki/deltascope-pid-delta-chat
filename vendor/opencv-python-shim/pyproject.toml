[project]
name = "opencv-python"
version = "5.0.0.93"
description = "DeltaScope server shim selecting the official headless OpenCV wheel"
requires-python = ">=3.11"
dependencies = [
  "opencv-python-headless==5.0.0.93"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opencv_python_shim"]
